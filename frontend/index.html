<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>.ng SafeCheck — Protecting Nigeria</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { background:#0d1b2a; color:white; text-align:center; padding:40px 20px; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .container { max-width:560px; width:100%; }
    img { height:110px; margin-bottom:12px; filter:drop-shadow(0 6px 12px rgba(0,0,0,0.5)); }
    h1 { font-size:3.2rem; font-weight:900; letter-spacing:-1px; margin:0; }
    .tagline { font-size:1.3rem; opacity:0.9; margin:12px 0 30px; }
    input { width:100%; padding:18px; font-size:1.3rem; border-radius:12px; border:none; margin-bottom:20px; text-align:center; }
    button { padding:18px 40px; font-size:1.3rem; font-weight:bold; border:none; border-radius:12px; cursor:pointer; transition:0.3s; }
    #checkBtn { background:#10b981; color:white; }
    #checkBtn:hover { background:#059669; }
    #reportBtn { background:#ef4444; color:white; display:none; animation:pulse 1.5s infinite; margin-top:20px; }
    #reportBtn:hover { background:#dc2626; }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
    .result { margin-top:40px; font-size:1.4rem; }
    .safe { color:#10b981; }
    .danger { color:#ef4444; }
    .confidence { font-size:2.5rem; font-weight:900; margin:15px 0; }
    .counter { margin-top:50px; font-size:1.1rem; opacity:0.8; }
    footer { margin-top:60px; font-size:0.9rem; opacity:0.7; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt=".ng SafeCheck">
    <h1>.ng SafeCheck</h1>
    <p class="tagline">One click. Know if it's real.</p>

    <input type="text" id="domainInput" placeholder="Enter any .ng domain (e.g. login-gtb.com.ng)" autofocus />
    <button id="checkBtn">CHECK NOW</button>

    <div id="loading" class="hidden">Scanning with AI + WHOIS + VirusTotal...</div>

    <div id="result" class="result hidden">
      <div id="riskLevel" class="confidence"></div>
      <div id="message"></div>
      <div id="confidenceText"></div>
      <button id="reportBtn">REPORT THIS FAKE SITE TO NiRA NOW</button>
    </div>

    <div class="counter">
      <strong id="blockedToday">0</strong> fake .ng sites reported to NiRA today
    </div>

    <footer>
      Built with love for Nigeria<br>
      Live & Open Source: <a href="https://github.com/aajetechnology/.ng-SafeCheck" style="color:#10b981" target="_blank">github.com/aajetechnology/.ng-SafeCheck</a>
    </footer>
  </div>

  <script>
    const API_URL = "https://ng-safecheck.onrender.com/api/check"; // CHANGE ONLY THIS LINE IF NEEDED
    const REPORT_URL = "https://ng-safecheck.onrender.com/report";

    const input = document.getElementById("domainInput");
    const checkBtn = document.getElementById("checkBtn");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");
    const riskLevel = document.getElementById("riskLevel");
    const message = document.getElementById("message");
    const confidenceText = document.getElementById("confidenceText");
    const reportBtn = document.getElementById("reportBtn");
    const blockedToday = document.getElementById("blockedToday");

    let currentDomain = "";

    async function checkDomain() {
      let domain = input.value.trim().toLowerCase();
      if (!domain) return alert("Please enter a domain");
      if (!domain.includes(".")) domain += ".ng";
      if (!domain.endsWith(".ng")) domain += ".ng";

      currentDomain = domain;
      loading.classList.remove("hidden");
      result.classList.add("hidden");
      checkBtn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({domain})
        });
        const data = await res.json();

        loading.classList.add("hidden");
        result.classList.remove("hidden");

        blockedToday.textContent = data.blocked_today || 0;

        if (data.safe) {
          riskLevel.textContent = "SAFE";
          riskLevel.className = "confidence safe";
          message.textContent = data.recommendation;
          confidenceText.textContent = "0% risk";
          reportBtn.style.display = "none";
        } else {
          riskLevel.textContent = "DANGEROUS";
          riskLevel.className = "confidence danger";
          message.innerHTML = `<strong>${data.risk}</strong><br>${data.recommendation}`;
          confidenceText.textContent = data.confidence.toFixed(1) + "% confidence";
          reportBtn.style.display = "block";
        }
      } catch (err) {
        loading.classList.add("hidden");
        alert("Scan failed — please try again");
      } finally {
        checkBtn.disabled = false;
        input.select();
      }
    }

    reportBtn.addEventListener("click", async () => {
      reportBtn.disabled = true;
      reportBtn.textContent = "Sending to NiRA...";

      try {
        const res = await fetch(REPORT_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({domain: currentDomain})
        });
        const json = await res.json();

        if (json.report_url) {
          window.open(json.report_url, "_blank");
          alert("Official NiRA report form opened!\nJust click SUBMIT — real takedown in progress.");
        } else {
          alert(json.message || "Report sent to NiRA!");
        }
      } catch {
        window.open("https://nira.org.ng/abuse-report/", "_blank");

      }
      reportBtn.disabled = false;
      reportBtn.textContent = "REPORT THIS FAKE SITE TO NiRA NOW";
    });

    checkBtn.addEventListener("click", checkDomain);
    input.addEventListener("keypress", e => { if (e.key === "Enter") checkDomain(); });
    input.select();
  </script>
</body>
</html>
