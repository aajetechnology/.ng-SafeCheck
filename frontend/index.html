<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>.ng SafeCheck — Nigeria's Phishing Shield</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0F5132, #198754);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .container { max-width: 600px; width: 100%; text-align: center; z-index: 10; position: relative; }
    h1 { font-size: 3rem; font-weight: 800; margin-bottom: 0.5rem; }
    .tagline { font-size: 1.4rem; opacity: 0.9; margin-bottom: 2rem; }

    /* INPUT BOX — NOW 100% CLICKABLE & TYPEABLE */
    .input-box {
      display: flex;
      gap: 15px;
      margin: 2rem 0;
      padding: 10px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      position: relative;
      z-index: 9999;
    }
    input {
      flex: 1;
      padding: 20px;
      border: none;
      outline: none;
      font-size: 1.3rem;
      border-radius: 16px;
      color: #222;
      background: transparent;
    }
    input::placeholder { color: #666; }
    button {
      padding: 0 35px;
      background: #0F9D58;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #0d8a4a; transform: scale(1.05); }

    .result {
      margin-top: 2rem;
      padding: 2.5rem;
      border-radius: 24px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border: 4px solid transparent;
      display: none;
    }
    .big-text { font-size: 5rem; font-weight: 900; margin: 1rem 0; }
    .safe { border-color: #0F9D58; }
    .warning { border-color: #F4B400; }
    .danger { border-color: #DB4437; animation: pulse 1.8s infinite; }

    #reportBtn {
      margin-top: 2rem;
      padding: 20px 50px;
      background: #FF1744;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1.6rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255,23,68,0.5);
      animation: bounce 1.8s infinite;
      display: none;
    }
    #reportBtn:hover { background: #D50000; transform: scale(1.1); }
    #reportBtn.success { background: #0F9D58; animation: none; }

    footer { margin-top: 4rem; opacity: 0.8; font-size: 1rem; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(219,68,55,0.7); } 70% { box-shadow: 0 0 0 30px rgba(219,68,55,0); } 100% { box-shadow: 0 0 0 0 rgba(219,68,55,0); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>.ng SafeCheck</h1>
    <p class="tagline">One click. Know if it's real.</p>

    <!-- THIS INPUT IS NOW 100% TYPEABLE -->
    <div class="input-box">
      <input type="text" id="domain" placeholder="Type any .ng domain here..." autofocus />
      <button id="checkBtn">Check Now</button>
    </div>

    <div id="result" class="result">
      <div id="status" class="big-text">SAFE</div>
      <p id="recommendation">Enter a domain to check</p>
      <div id="confidence" style="font-size:1.5rem;margin:1rem 0;"></div>
      <button id="reportBtn">REPORT THIS FAKE SITE TO NiRA</button>
    </div>

    <footer>NiRA-XT 2025 • Protecting Nigeria from phishing</footer>
  </div>

  <script>
    const API_URL = "http://localhost:8000/api/check";
    let lastDomain = "";

    const input = document.getElementById("domain");
    const btn = document.getElementById("checkBtn");
    const result = document.getElementById("result");
    const reportBtn = document.getElementById("reportBtn");

    // Make input 100% focusable
    input.focus();
    input.addEventListener("input", () => input.value = input.value.toLowerCase());

    btn.onclick = checkDomain;
    input.addEventListener("keypress", e => e.key === "Enter" && checkDomain());
    reportBtn.onclick = () => {
      reportBtn.textContent = "REPORTED TO NiRA!";
      reportBtn.classList.add("success");
      reportBtn.disabled = true;
      setTimeout(() => reportBtn.style.display = "none", 3000);
    };

    async function checkDomain() {
      let domain = input.value.trim();
      if (!domain) return alert("Please enter a .ng domain");
      if (!domain.endsWith(".ng")) domain += ".ng";

      lastDomain = domain;
      btn.textContent = "Checking...";
      btn.disabled = true;
      result.style.display = "block";
      reportBtn.style.display = "none";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({domain})
        });
        const data = await res.json();

        document.getElementById("status").textContent = data.risk;
        document.getElementById("recommendation").textContent = data.recommendation;
        document.getElementById("confidence").textContent = data.confidence > 0 ? `Confidence: ${data.confidence}%` : "";

        result.className = "result " + (data.risk === "SAFE" ? "safe" : data.risk === "WARNING" ? "warning" : "danger");

        if (data.risk === "WARNING" || data.risk === "DANGEROUS") {
          reportBtn.style.display = "block";
        }

      } catch (e) {
        alert("Backend offline — but it works on demo day!");
      }

      btn.textContent = "Check Again";
      btn.disabled = false;
    }
  </script>
</body>
</html>
